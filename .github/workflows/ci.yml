name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Check dependencies
        run: nix-shell --run 'just check-deps'

      - name: Build LCC compiler
        run: nix-shell --run 'just build-lcc'

      - name: Build project
        run: nix-shell --run 'just build'

      - name: Build release version
        run: nix-shell --run 'just build-release'

      - name: Check code size
        run: nix-shell --run 'just code-size'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/miniforth*
            build/tests/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Run static analysis
        run: nix-shell --run 'just lint'

      - name: Check code formatting
        run: nix-shell --run 'just format && git diff --exit-code'

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Build project
        run: nix-shell --run 'just build'

      - name: Run VM tests
        run: nix-shell --run 'just vm-test'

      - name: Run compiler tests
        run: nix-shell --run 'just compiler-test'

      - name: Run integration tests
        run: nix-shell --run 'just integration'

      - name: Run full development cycle
        run: nix-shell --run 'just dev'

  lcc-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Build LCC compiler
        run: nix-shell --run 'just build-lcc'

      - name: Run quick LCC tests
        run: nix-shell --run 'just quick-test'

      - name: Test LCC Miniforth compilation
        run: nix-shell --run 'just test-lcc-miniforth'

      - name: Test arithmetic operations
        run: nix-shell --run 'just test-category arithmetic'

      - name: Test control flow
        run: nix-shell --run 'just test-category control_flow'

      - name: Test algorithms
        run: nix-shell --run 'just test-category algorithms'

      - name: Test stress scenarios
        run: nix-shell --run 'just test-category stress'

      - name: Test data structures
        run: nix-shell --run 'just test-category data_structures'

      - name: Test edge cases
        run: nix-shell --run 'just test-category edge_cases'

      - name: Test mathematical computations
        run: nix-shell --run 'just test-category math'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: lcc-test-results
          path: |
            build/lcc_tests/
            build/quick_tests/
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Generate coverage report
        run: nix-shell --run 'just coverage'

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_html/
          retention-days: 30

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Build project
        run: nix-shell --run 'just build'

      - name: Run benchmarks
        run: nix-shell --run 'just benchmark'

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/benchmark_results/
          retention-days: 30

  nix-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Test Nix shell environment
        run: nix-shell --run 'echo "Nix shell environment working"'

      - name: Verify development tools
        run: nix-shell --run 'gcc --version && cmake --version && just --version'

      - name: Test shell hook
        run: nix-shell --run 'ls -la build/ || echo "Build directory will be created"'

      - name: Validate project status
        run: nix-shell --run 'just status'

  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Run security scan
        run: nix-shell --run 'just lint'

      - name: Check for secrets
        run: |
          if grep -r "password\|secret\|token\|key" --include="*.c" --include="*.h" src/; then
            echo "⚠️  Potential secrets found in source code"
            exit 1
          fi

      - name: Verify no hardcoded credentials
        run: |
          if grep -r "admin\|root\|default" --include="*.c" --include="*.h" src/; then
            echo "⚠️  Potential hardcoded credentials found"
            exit 1
          fi